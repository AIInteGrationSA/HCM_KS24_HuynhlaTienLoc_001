server:
  port: ${SERVER_PORT:8080}

spring:
  profiles:
    default: cloud
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
  ai:
    vectorstore:
      pgvector:
        table-name: ${PGVECTOR_TABLE_NAME:vector_store}
        distance-type: COSINE_DISTANCE
        initialize-schema: ${PGVECTOR_INITIALIZE_SCHEMA:false}

langfuse:
  public-key: ${LANGFUSE_PUBLIC_KEY:pk-lf-71ea2ab6-c1df-457b-ac84-f1691380a436}
  secret-key: ${LANGFUSE_SECRET_KEY:sk-lf-b9818c96-aced-4484-ba15-e7c57a6af714}
  host: ${LANGFUSE_HOST:http://localhost:3000}

mcp:
  antigravity:
    enabled: ${MCP_ANTIGRAVITY_ENABLED:false}
    endpoint: ${MCP_ANTIGRAVITY_ENDPOINT:}
    token: ${MCP_ANTIGRAVITY_TOKEN:}
